</head>
<body>

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="product-card p-5">
                <h1 class="brand-name mb-4">Ummi Abdalla</h1>

                <form action="#">
                    <input type="text" class="form-control form-input mb-3" placeholder="Full Name" required>
                    <input type="email" class="form-control form-input mb-3" placeholder="Email Address" required>
                    <textarea class="form-control form-input mb-4" rows="4" placeholder="Your Message"></textarea>
                    <button type="submit" class="btn btn-fancy w-100">Send Message</button>
                </form>
                <div class="mt-4">
                    <a href="index.html" class="text-white-50 small text-decoration-none">← Return to Gallery</a>
                </div>
            </div>
        </div>
